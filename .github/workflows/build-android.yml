name: Build Android APK (Final Stable)

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2️⃣ Setup Node
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    # 3️⃣ Install dependencies
    - name: Install Dependencies
      run: npm ci

    # 4️⃣ Build frontend
    - name: Build Web App
      run: npm run build

    # 5️⃣ Sync Capacitor
    - name: Sync Capacitor
      run: npx cap sync android

    # 6️⃣ Setup Java
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # 7️⃣ Setup Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 8️⃣ Accept licenses
    - name: Accept Licenses
      run: yes | sdkmanager --licenses

    # 9️⃣ Fix SDK path
    - name: Fix SDK Path
      run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

    # 🔟 Install Gradle (SAFE way)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 1️⃣1️⃣ Generate Gradle Wrapper (SAFE)
    - name: Generate Gradle Wrapper
      run: |
        cd android
        gradle wrapper

    # 1️⃣2️⃣ Fix permission
    - name: Fix Gradle Permission
      run: chmod +x android/gradlew

    # 1️⃣3️⃣ Build APK
    - name: Build APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    # 1️⃣4️⃣ Upload APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/app/build/outputs/apk/debug/*.apk
