name: Build Android APK (Capacitor)

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2️⃣ Setup Node.js (Required for Capacitor)
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    # 3️⃣ Install dependencies
    - name: Install Dependencies
      run: npm ci

    # 4️⃣ Build frontend (Vite/React)
    - name: Build Web App
      run: npm run build

    # 5️⃣ Sync Capacitor Android
    - name: Sync Capacitor
      run: npx cap sync android

    # 6️⃣ Setup Java (Required for Gradle)
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 7️⃣ Install Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 8️⃣ Accept licenses (important)
    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses

    # 9️⃣ Fix gradlew permission (CRITICAL FIX)
    - name: Fix Gradle Permission
      run: chmod +x android/gradlew

    # 🔟 Cache Gradle (faster builds)
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle

    # 1️⃣1️⃣ Build APK
    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug

    # 1️⃣2️⃣ Verify APK exists
    - name: Verify APK
      run: ls -R android/app/build/outputs/apk/

    # 1️⃣3️⃣ Upload APK Artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/app/build/outputs/apk/debug/*.apk
